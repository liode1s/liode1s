name: Blog Posts

on:
  # The lioders.com blog is retired; automatic updates are disabled.
  # Restore a valid feed and README blog markers before running manually.
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          # comma-separated list of RSS feed urls
          feed_list: "https://lioders.com/atom.xml"
